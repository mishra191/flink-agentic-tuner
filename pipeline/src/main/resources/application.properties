# Defaults. Any key can be overridden on the command line, e.g.
#   --flink.checkpoint.interval.ms 30000 --sink.bucket.strategy symbol_hour
# These are the knobs the tuning agent is allowed to change.

# Kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic=trades
kafka.group.id=trade-parquet-pipeline


# Flink
flink.parallelism=4
flink.max.parallelism=128
flink.checkpoint.interval.ms=10000


# Output
output.path=file:///tmp/trade-parquet/output

# Sink: bucket strategy is one of symbol | hour | symbol_hour
sink.bucket.strategy=symbol
sink.rolling.max.part.mb=128
sink.rolling.interval.min=5
